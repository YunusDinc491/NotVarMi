services:
  - type: web
    name: notvarmi-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 8080
      - key: ConnectionStrings__Notes
        sync: false
      - key: Accounts__Admin__PasswordHash
        sync: false
      - key: Accounts__Viewer__PasswordHash
        sync: false
      - key: R2__Endpoint
        sync: false
      - key: R2__Bucket
        sync: false
      - key: R2__AccessKeyId
        sync: false
      - key: R2__SecretAccessKey
        sync: false
